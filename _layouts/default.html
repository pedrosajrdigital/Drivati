<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    {% seo title=false %}

    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <meta name="theme-color" content="#7C3AED">

    <link rel="preload" href="{{ '/assets/fonts/jost-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/montserrat-latin-800-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/tokens.css' | relative_url }}">
    {% unless page.standalone %}<link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}">{% endunless %}
    <link rel="stylesheet" href="{{ '/assets/css/' | append: page.css | append: '.css' | relative_url }}">

    <link rel="stylesheet" href="{{ '/assets/css/consent.css' | relative_url }}">
    <script src="{{ '/assets/js/consent.js' | relative_url }}" defer></script>
</head>
<body>

{% include header.html %}

{{ content }}

{% include footer.html %}

</body>
</html>
